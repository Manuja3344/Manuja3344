# =====================================================
#  Profile Metrics — auto-generates metrics.svg
#
#  SETUP (one-time, ~5 minutes):
#
#  1. Create a GitHub Personal Access Token:
#     https://github.com/settings/tokens/new
#     → Name:   "metrics-token" (or anything)
#     → Expiry: 90 days (or "No expiration")
#     → Scopes: ✅ repo  ✅ read:user
#     → Click "Generate token" and COPY the value
#
#  2. Add the token as a repository secret:
#     https://github.com/Manuja3344/Manuja3344/settings/secrets/actions
#     → "New repository secret"
#     → Name:  METRICS_TOKEN
#     → Value: paste the token you copied
#     → "Add secret"
#
#  3. Commit this file to:
#     .github/workflows/metrics.yml
#
#  4. Push to main, then go to:
#     https://github.com/Manuja3344/Manuja3344/actions
#     → Click "Profile Metrics" on the left
#     → Click "Run workflow" → "Run workflow"
#
#  After that first run, metrics.svg appears in your
#  repo root and the README displays it. It auto-
#  refreshes every 24 hours via cron.
# =====================================================

name: Profile Metrics

on:
  # Runs every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # ── Who ──
          user: Manuja3344

          # ── Base content ──
          base: header, activity, community, repositories, metadata

          # ── Plugin: Languages ──
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes

          # ── Plugin: Achievements ──
          plugin_achievements: yes
          plugin_achievements_display: compact

          # ── Plugin: Notable contributions ──
          plugin_notable: yes
          plugin_notable_from: all

          # ── Plugin: Activity ──
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

          # ── Plugin: Contribution calendar ──
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ── Appearance ──
          config_timezone: Asia/Colombo
          config_display: large
